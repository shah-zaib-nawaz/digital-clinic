name: Digital Clinic CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb://127.0.0.1:27017/digital_clinic_ci' }}
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-testing-better-auth-secret-min-32-characters-long!' }}
  BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL || 'http://localhost:3000' }}
  AI_HMAC_SECRET: ${{ secrets.AI_HMAC_SECRET || 'ci-testing-ai-hmac-secret-min-32-characters-long!' }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-dummy-key-for-ci-testing-purposes' }}

jobs:
  # ==============================================================
  # Job 1: Supply Chain, Code Quality & TypeScript 7.0 Typecheck
  # ==============================================================
  quality-and-typecheck:
    name: Quality, Security & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Supply-Chain & Lockfile Integrity
        run: pnpm verify:supply-chain

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript 7.0 Typecheck (tsgo --noEmit)
        run: pnpm typecheck

  # ==============================================================
  # Job 2: Vitest 5.0.5 Unit & Replica-Set Integration Tests
  # ==============================================================
  unit-and-integration:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest Unit Tests (53 tests)
        run: pnpm test:unit

      - name: Run 50-Case Adversarial AI Safety Benchmark
        run: pnpm eval:ai-safety

      - name: Run MongoDB Replica-Set ACID Integration Tests
        run: pnpm test:integration

  # ==============================================================
  # Job 3: Playwright 1.64.1 Sharded E2E & WebMCP Agent Tests
  # ==============================================================
  e2e-playwright-sharded:
    name: Playwright E2E & WebMCP (Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Seed Clinical Baseline Database
        run: pnpm exec tsx scripts/seed-clinic.ts
        env:
          MONGODB_URI: 'mongodb://127.0.0.1:27017/digital_clinic_ci'

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright Tests (Shard ${{ matrix.shard }})
        run: pnpm exec playwright test --shard=${{ matrix.shard }}
        env:
          CI: 'true'
          PLAYWRIGHT_TEST_BASE_URL: 'http://localhost:3000'
          MONGODB_URI: 'mongodb://127.0.0.1:27017/digital_clinic_ci'

      - name: Upload Shard Blob Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-shard-${{ strategy.job-index }}
          path: blob-report
          retention-days: 1

  # ==============================================================
  # Merge Playwright Reports
  # ==============================================================
  merge-playwright-reports:
    name: Merge Sharded Playwright Reports
    needs: [e2e-playwright-sharded]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Sharded Blob Reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-shard-*
          merge-multiple: true

      - name: Merge Reports
        run: |
          if [ -d "./all-blob-reports" ] && [ "$(ls -A ./all-blob-reports 2>/dev/null)" ]; then
            pnpm exec playwright merge-reports --reporter html ./all-blob-reports
          else
            echo "No blob reports found, generating stub report directory"
            mkdir -p playwright-report
            echo "<!DOCTYPE html><html><body><h1>E2E Test Report Generated</h1></body></html>" > playwright-report/index.html
          fi

      - name: Upload Unified HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-unified
          path: playwright-report
          retention-days: 14

  # ==============================================================
  # Job 4: Next.js 16.4 Turbopack Production Build
  # ==============================================================
  production-build:
    name: Next.js 16.4 Production Build
    needs: [quality-and-typecheck, unit-and-integration]
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Next.js Turbopack Build
        run: pnpm build
        env:
          NODE_ENV: 'production'
          MONGODB_URI: 'mongodb://127.0.0.1:27017/digital_clinic_ci'
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-testing-better-auth-secret-min-32-characters-long!' }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL || 'http://localhost:3000' }}
          AI_HMAC_SECRET: ${{ secrets.AI_HMAC_SECRET || 'ci-testing-ai-hmac-secret-min-32-characters-long!' }}
